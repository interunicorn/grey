[package]
name = "grey"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.8.0"
bevy = { version = "0.20.1", features = ["dynamic_linking"] }

[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
